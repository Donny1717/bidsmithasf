name: UK Procurement Registry Daily Scraper

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger from Actions tab

jobs:
  scrape-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run UK Procurement Scraper
        run: |
          python uk_procurement_scraper.py --mode backfill --delay 2.0 --output-dir downloads --csv-path procurement_registry_index.csv

      - name: Commit and Push Updated Index
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add procurement_registry_index.csv downloads/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update UK Procurement Registry index [skip ci]" && git push)
